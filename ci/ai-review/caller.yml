name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["@@BASE_BRANCH@@"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: joaomj/pi-agent-config/.github/workflows/ai-review.yml@@WORKFLOW_SHA@@
    with:
      config-ref: "@@CONFIG_SHA@@"
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

name: Check Claude transport pin

# The transport releases in its own repository, which cannot trigger this one,
# so a daily run catches a new release that lands between pushes here.
on:
  push:
    branches: [main]
    paths: [install.sh, scripts/check-claude-pin.sh, .github/workflows/check-claude-pin.yml]
  pull_request:
    paths: [install.sh, scripts/check-claude-pin.sh, .github/workflows/check-claude-pin.yml]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pin with the newest transport release
        run: bash scripts/check-claude-pin.sh
